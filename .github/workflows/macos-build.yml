name: macOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest # Apple Silicon (arm64)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 显式 build（而非 tauri-action）：bundler 在指定 --target 时会跳过
      # .app bundle 签名，产物被 Gatekeeper 判定"已损坏"，需要自行深度签名
      - name: Build Tauri app
        run: pnpm tauri build --target aarch64-apple-darwin

      - name: Ad-hoc codesign app bundle
        run: |
          APP="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/SSSC.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          echo "✅ 签名校验通过"

      - name: Repack DMG
        run: |
          APP_DIR="src-tauri/target/aarch64-apple-darwin/release/bundle/macos"
          VERSION=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          STAGING=$(mktemp -d)
          cp -R "$APP_DIR/SSSC.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "SSSC" -srcfolder "$STAGING" -ov -format UDZO \
            "SSSC_${VERSION}_aarch64.dmg"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sssc-macos-apple-silicon
          path: SSSC_*_aarch64.dmg
          if-no-files-found: error
          retention-days: 30

      # 打 tag(v*) 时上传安装包到 Release
      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SSSC_*_aarch64.dmg
