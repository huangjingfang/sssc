name: macOS Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        settings:
          # macos-14+ runner 为 Apple Silicon (arm64)，macos-13 为 Intel (x86_64)
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: apple-silicon
          - platform: macos-13
            target: x86_64-apple-darwin
            label: intel
    runs-on: ${{ matrix.settings.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 分别打包 Apple Silicon / Intel 目标（.app + .dmg）
          args: '--target ${{ matrix.settings.target }}'
          # 打 tag(v*) 时自动创建 Release 并上传安装包
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: 'SSSC ${{ github.ref_name }}'
          releaseBody: 'macOS 安装包:.dmg（Apple Silicon 与 Intel 两个架构）'
          releaseDraft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sssc-macos-${{ matrix.settings.label }}
          path: |
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.settings.target }}/release/bundle/macos/*.app
          if-no-files-found: error
          retention-days: 30
